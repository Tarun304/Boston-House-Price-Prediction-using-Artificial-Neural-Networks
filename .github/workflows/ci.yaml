name: CI Pipeline

on: 
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install UV
        run: |
          pip install uv

      - name: Cache UV dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest

      - name: Configure DVC
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user ${{ secrets.DAGSHUB_USERNAME }}
          dvc remote modify origin --local password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull data from DVC
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc pull -r origin || echo "No remote data to pull"

      - name: Run DVC pipeline
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc repro

      - name: Run model tests
        run: |
          pytest tests/test_model.py -v

      - name: Run API tests
        run: |
          pytest tests/test_api.py -v

      - name: Push to DVC remote
        if: github.ref == 'refs/heads/main' && success()
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc push -r origin

      - name: Promote model to production
        if: github.ref == 'refs/heads/main' && success()
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python scripts/model_promotion.py

      - name: Upload promotion flag
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v3
        with:
          name: promotion-flag
          path: model_promoted.txt

      - name: Display pipeline results
        if: always()
        run: |
          echo "Pipeline Results:"
          if [ -f "reports/metrics.json" ]; then
            cat reports/metrics.json
          else
            echo "No metrics file found"
          fi

  build-and-push-docker:
    needs: ml-pipeline
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && success()
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Download promotion flag
        uses: actions/download-artifact@v3
        with:
          name: promotion-flag
        continue-on-error: true

      - name: Check if model was promoted
        id: check_promotion
        run: |
          if [ -f "model_promoted.txt" ]; then
            PROMOTED=$(cat model_promoted.txt)
            echo "promoted=$PROMOTED" >> $GITHUB_OUTPUT
            echo "Model promotion status: $PROMOTED"
          else
            echo "promoted=false" >> $GITHUB_OUTPUT
            echo "No promotion flag found"
          fi

      - name: Check if Docker files changed
        id: check_docker_changes
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD HEAD~1 | grep -E '(Dockerfile|requirements.*txt|docker-compose.yml|src/api/|src/streamlit_app/)' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "docker_changed=true" >> $GITHUB_OUTPUT
            echo "Docker-related files changed:"
            echo "$CHANGED_FILES"
          else
            echo "docker_changed=false" >> $GITHUB_OUTPUT
            echo "No Docker-related files changed"
          fi

      - name: Decide whether to build Docker
        id: should_build
        run: |
          PROMOTED="${{ steps.check_promotion.outputs.promoted }}"
          DOCKER_CHANGED="${{ steps.check_docker_changes.outputs.docker_changed }}"
          
          if [ "$PROMOTED" = "true" ] || [ "$DOCKER_CHANGED" = "true" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "Will build Docker images"
            if [ "$PROMOTED" = "true" ]; then
              echo "  Reason: New model promoted to production"
            fi
            if [ "$DOCKER_CHANGED" = "true" ]; then
              echo "  Reason: Docker files changed"
            fi
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "Skipping Docker build (no model promotion or Docker changes)"
          fi

      - name: Set up Docker Buildx
        if: steps.should_build.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.should_build.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository owner to lowercase
        if: steps.should_build.outputs.build == 'true'
        id: repo
        run: |
          echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push FastAPI image
        if: steps.should_build.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/boston-api:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/boston-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Streamlit image
        if: steps.should_build.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.streamlit
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/boston-streamlit:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/boston-streamlit:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker build summary
        if: steps.should_build.outputs.build == 'true'
        run: |
          echo "Docker images built and pushed successfully"
          echo "FastAPI: ghcr.io/${{ steps.repo.outputs.owner }}/boston-api:latest"
          echo "Streamlit: ghcr.io/${{ steps.repo.outputs.owner }}/boston-streamlit:latest"
